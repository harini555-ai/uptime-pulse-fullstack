version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: uptimepulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uptimepulse
      MYSQL_USER: uptimepulse
      MYSQL_PASSWORD: uptimepulse
    ports:
      - "3306:3306"
    volumes:
      - uptimepulse-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uptimepulse-mysql-data:
    driver: local
