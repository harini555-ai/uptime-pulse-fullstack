# ============================================================
# UptimePulse - Application Configuration
# ============================================================

spring.application.name=uptimepulse

# ---------------- Server ----------------
server.port=8080

# ---------------- Datasource ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/uptimepulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Haru#123#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- Connection Pool (HikariCP) ----------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ---------------- UptimePulse Custom Settings ----------------
# Interval (in ms) between automated health checks for every monitor
uptimepulse.worker.fixed-delay-ms=30000
# HTTP request timeout (in ms) when pinging a monitored URL
uptimepulse.worker.connect-timeout-ms=8000
uptimepulse.worker.read-timeout-ms=8000
# Number of consecutive failures before a monitor is flagged DOWN
uptimepulse.worker.failure-threshold=1
# Number of days of ping_logs history retained before pruning
uptimepulse.worker.retention-days=14

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.monitor.uptimepulse=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
